<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan-dim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0.08" />
    </linearGradient>
  </defs>

  <!-- Background shield shape -->
  <path d="M60 10 L110 10 L120 50 L90 110 L60 50 Z"
        fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.3"/>
  <path d="M60 14 L106 14 L115 48 L90 100 L65 48 Z"
        fill="url(#cyan-dim)" stroke="none" opacity="0.4"/>

  <!-- S -->
  <text x="68" y="70" font-family="'JetBrains Mono', monospace" font-size="48"
        font-weight="700" fill="#00d4ff">S</text>

  <!-- T -->
  <text x="130" y="70" font-family="'JetBrains Mono', monospace" font-size="48"
        font-weight="300" fill="#00d4ff" opacity="0.6">T</text>

  <!-- R -->
  <text x="188" y="70" font-family="'JetBrains Mono', monospace" font-size="48"
        font-weight="300" fill="#00d4ff" opacity="0.6">R</text>

  <!-- Y -->
  <text x="248" y="70" font-family="'JetBrains Mono', monospace" font-size="48"
        font-weight="700" fill="#00ff41">Y</text>

  <!-- X -->
  <text x="310" y="70" font-family="'JetBrains Mono', monospace" font-size="48"
        font-weight="300" fill="#00d4ff" opacity="0.6">X</text>

  <!-- Tagline -->
  <text x="200" y="98" font-family="'JetBrains Mono', monospace" font-size="10"
        text-anchor="middle" fill="#64748b" letter-spacing="4">
    THREAT RESPONSE &amp; YBER ASSESSMENT
  </text>

  <!-- Underline accent -->
  <line x1="60" y1="105" x2="340" y2="105" stroke="#2a3040" stroke-width="1"/>
  <line x1="60" y1="105" x2="200" y2="105" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>

  <!-- Decorative dots -->
  <circle cx="58" cy="14" r="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="342" cy="14" r="2" fill="#00ff41" opacity="0.6"/>
  <circle cx="58" cy="106" r="2" fill="#00ff41" opacity="0.4"/>
  <circle cx="342" cy="106" r="2" fill="#00d4ff" opacity="0.4"/>
</svg>
